<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify Email | Humara Ghar</title>

    <link
        rel="stylesheet"
        href="css/verify-email.css"
    >

</head>

<body>

<div class="verify-page">

    <div class="verify-card">

        <div class="logo">
            ⌂
        </div>

        <p class="eyebrow">
            HUMARA GHAR
        </p>

        <h1>
            Check your email.
        </h1>

        <p class="description">

            We've sent a verification link to
            <strong id="userEmail">your email address</strong>.

            Open the email and click the verification
            link to activate your Humara Ghar account.

        </p>

        <div
            id="message"
            class="message"
        ></div>

        <button
            id="checkVerification"
            class="primary-btn"
        >
            I've verified my email →
        </button>

        <button
            id="resendEmail"
            class="secondary-btn"
        >
            Resend verification email
        </button>

        <button
            id="logout"
            class="logout-btn"
        >
            Sign out
        </button>

    </div>

</div>

<script
    type="module"
    src="js/verify-email.js"
></script>

</body>

</html>
